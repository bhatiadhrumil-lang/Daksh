services:
  postgres:
    image: postgres:16-alpine
    container_name: oasis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oasis
      POSTGRES_PASSWORD: oasis_local_dev
      POSTGRES_DB: oasis
    ports:
      - "5433:5432"
    volumes:
      - oasis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oasis -d oasis"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  oasis_pgdata:
